[project]
name = "chat-daily-tg"
version = "0.4.0"
description = "Daily multi-source chat summary to Telegram with local archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # [socks] pulls in socksio so httpx.Client() can build a transport for a
    # socks5:// proxy (ALL_PROXY from Shadowrocket) instead of crashing at
    # construction with ImportError — the 2026-07-03 exit=1 failure.
    "httpx[socks]>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "tenacity>=8.2",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-mock>=3.12",
]

[project.scripts]
chat-daily = "chat_daily_tg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
markers = [
    "e2e: hermetic CLI-to-HTTP tests with no external credentials or network",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
